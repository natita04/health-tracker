name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk health-tracker-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: health-tracker-1.0.${{ github.run_number }}
          path: health-tracker-*.apk

      # A release gives a direct download link you can open on your phone.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Health Tracker 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: health-tracker-*.apk
          make_latest: true
          body: |
            Install on your phone: download the APK below and open it.
            Updating? Just install over the old one, your history stays. Don't uninstall first.
